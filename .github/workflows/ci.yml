name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Lint PHP files
        # xargs fails when any file fails; php -l lints a single file per call before PHP 8.3
        run: find config web/index.php web/wp-config.php web/content/mu-plugins/load.php bin/console -type f -print0 | xargs -0 -n1 php -l

      - name: Check config/application.php
        run: php .github/tests/application-config.php
