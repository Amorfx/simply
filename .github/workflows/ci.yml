name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Lint PHP files
        # xargs fails when any file fails; php -l lints a single file per call before PHP 8.3
        run: find config web/index.php web/wp-config.php web/content/mu-plugins/load.php bin/console -type f -print0 | xargs -0 -n1 php -l

      - name: Check config/application.php
        run: php .github/tests/application-config.php

  docker:
    runs-on: ubuntu-latest
    name: Docker development environment

    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i 's#^WP_HOME=.*#WP_HOME=http://localhost:8080#; s#^DB_HOST=.*#DB_HOST=db#' .env

      - name: Start
        run: USER_ID=$(id -u) GROUP_ID=$(id -g) docker compose up -d --build --wait

      - name: Install
        run: docker compose exec -T -u www-data web docker/setup.sh

      - name: Check the site and the Simply commands
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 200
          docker compose exec -T -u www-data web php bin/console list simply | grep -q 'simply:cache:clear'

      - name: Logs on failure
        if: failure()
        run: docker compose logs
