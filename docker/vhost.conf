<VirtualHost *:80>
    DocumentRoot /var/www/project/web

    <Directory /var/www/project/web>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Never run PHP from uploads, nor serve configuration or lock files
    <Directory /var/www/project/web/content/uploads>
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
    </Directory>
    <FilesMatch "\.(ya?ml|lock|dist|neon)$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
