; Development settings
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
display_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr
; Re-read PHP files on every request, so that code changes are picked up immediately
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
