# Development environment. Compose reads DB_NAME, DB_USER and DB_PASSWORD from the project .env file,
# which must also contain DB_HOST=db. See README.md.
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:?Set DB_NAME in .env (cp .env.example .env)}
      MARIADB_USER: ${DB_USER:?Set DB_USER in .env (cp .env.example .env)}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (cp .env.example .env)}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./docker
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    volumes:
      - .:/var/www/project
    ports:
      # Only reachable from this machine: the development site has an admin/admin account and displays errors
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
